{{/*
LLM API key secret. Created ONLY when the user set llm.apiKey and did not
name an existingSecret — otherwise the chart must not manage credentials.
*/}}
{{- if and .Values.llm.apiKey (not .Values.llm.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-llm" (include "customs-screen.fullname" .) }}
  labels:
    {{- include "customs-screen.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.llm.secretKey }}: {{ .Values.llm.apiKey | quote }}
{{- end }}
